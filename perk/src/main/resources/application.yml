alipay:
  appId: ${ALIPAY_APP_ID:}
  appPrivateKey: ${ALIPAY_APP_PRIVATE_KEY:}
  alipayPublicKey: ${ALIPAY_PUBLIC_KEY:}
  notifyUrl: ${ALIPAY_NOTIFY_URL:http://localhost:9090/alipay/success}
  returnUrl: ${ALIPAY_RETURN_URL:http://localhost:8080/#/cart}
  signType: ${ALIPAY_SIGN_TYPE:RSA2}
  charset: ${ALIPAY_CHARSET:utf-8}
  gatewayUrl: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:9090}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHOP_DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SHOP_DB_USERNAME:shop}
    password: ${SHOP_DB_PASSWORD:}
  mail:
    from: ${MAIL_FROM:}
    host: ${MAIL_HOST:smtp.163.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          port: ${MAIL_SMTP_PORT:465}
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
    default-encoding: utf-8

file:
  ip: ${FILE_SERVER_IP:localhost}
